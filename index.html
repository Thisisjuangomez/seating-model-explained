<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Seating Model Explained</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one living 3D office (the paper's case: 5 rooms, 40 desks, 25 people) under an HTML narrative layer; 16:9, text never covers the focal subject. */
:root {
  color-scheme: dark;
  --navy: #14263D; --navy-card: #1D3452; --blue: #356AE6; --blue-soft: #EEF4FF; --teal: #16A6A1; --mint: #DDF5EB;
  --cloud: #F7F9FC; --white: #FFFFFF; --lav: #B8B5FF; --cyan: #6EE7F5; --amber: #B45309; --amber-2: #F2B84B; --coral: #E76F6A; --green: #15803D;
  --ink: #172B4D; --ink-2: #64748B; --paper: #FFFFFF; --paper-2: #B7C3D4; --border: #E2E8F0;
  --tA: #4F6D8A; --tB: #7C6FA6; --tC: #8A7A52; --tD: #A0687A;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --t-display: clamp(38px, 4.9vw, 92px);
  --t-h2: clamp(24px, 2.6vw, 50px);
  --t-lead: clamp(14px, 1.08vw, 20px);
  --t-label: clamp(11px, .78vw, 14px);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --g: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --side: clamp(0px, 3.2vw, 60px);
}
html, body { height: 100%; }
body { background: var(--navy); color: var(--paper); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#scrim, #band { position: fixed; pointer-events: none; transition: opacity 700ms ease, background 600ms ease; }
#scrim { inset: 0; opacity: 0; }
#band { left: 0; right: 0; bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 140px); }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag3d { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; display: inline-flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.tag3d .st { font-weight: 700; padding: 2px 6px; border-radius: 4px; color: var(--navy); }
.tag3d .u { font-family: var(--mono); font-weight: 700; padding: 1px 7px; border-radius: 4px; font-size: 12px; }
.on-light .tag3d { background: rgba(255,255,255,.94); color: var(--ink); box-shadow: 0 6px 18px rgba(20,38,61,.12); }
.on-dark .tag3d { background: rgba(20,38,61,.86); color: var(--paper); border: 1px solid rgba(255,255,255,.14); }

#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); left: var(--g); right: var(--gr); display: flex; align-items: center; justify-content: space-between; gap: 16px; pointer-events: none; padding-inline: clamp(0px, 2vw, 32px); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 13px; letter-spacing: .16em; }
.brand svg { width: 24px; height: 24px; }

.panel { position: absolute; display: flex; flex-direction: column; gap: clamp(10px, 1.15vw, 18px); opacity: 0; transform: translateY(18px); transition: opacity 520ms var(--ease-out), transform 620ms var(--ease-out); }
.panel.in { opacity: 1; transform: none; }
.panel.left, .panel.right, .panel.wide { top: calc(env(safe-area-inset-top, 0px) + 66px); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); justify-content: center; overflow: auto; scrollbar-width: thin; padding-right: 4px; }
.panel.left { left: calc(var(--g) + var(--side)); width: min(36rem, 40vw); }
.panel.right { right: calc(var(--gr) + var(--side)); width: min(37rem, 41vw); }
.panel.wide { left: calc(var(--g) + var(--side)); width: min(64rem, 60vw); }
.panel.center { left: 50%; top: 50%; translate: -50% -50%; width: min(70rem, calc(100vw - 32px)); }
.panel.cover { left: calc(var(--g) + var(--side)); top: 50%; translate: 0 -50%; width: min(52rem, 60vw); }
.panel.band { left: calc(var(--g) + var(--side)); right: calc(var(--gr) + var(--side)); top: calc(env(safe-area-inset-top, 0px) + 66px); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); justify-content: space-between; pointer-events: none; }
.panel.band > * { pointer-events: auto; }
.panel.band .head { max-width: min(46rem, 60vw); display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: var(--t-label); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; display: inline-flex; gap: 10px; align-items: center; }
.eyebrow::before { content: ""; width: 22px; height: 3px; border-radius: 2px; background: var(--teal); }
h1, h2, h3, p { margin: 0; }
h1 { font-size: var(--t-display); line-height: 1.02; font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }
h2 { font-size: var(--t-h2); line-height: 1.08; font-weight: 800; letter-spacing: -.028em; text-wrap: balance; }
h3 { font-size: clamp(14px, 1.02vw, 19px); font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
.lead { font-size: var(--t-lead); line-height: 1.5; text-wrap: pretty; }
.small { font-size: var(--t-label); line-height: 1.45; }
.mono { font-family: var(--mono); font-weight: 500; }
.on-light { color: var(--ink); }
.on-light .lead, .on-light .small, .on-light .muted { color: var(--ink-2); }
.on-dark .lead, .on-dark .small, .on-dark .muted { color: var(--paper-2); }
.cy { color: var(--cyan); }

.card { border-radius: 12px; padding: clamp(12px, 1vw, 18px); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.on-light .card { background: var(--white); border: 1px solid var(--border); }
.on-dark .card { background: var(--navy-card); border: 1px solid rgba(255,255,255,.1); }
.card.hl { background: var(--blue-soft) !important; border: 1.5px solid var(--blue) !important; color: var(--ink); }
.card.hl .muted, .card.hl .small { color: var(--ink-2); }
.card .k { font-size: 12px; font-weight: 700; letter-spacing: .02em; font-style: italic; }
.on-light .card .k { color: var(--ink-2); }
.on-dark .card .k { color: var(--paper-2); }
.card p { font-size: clamp(13px, .92vw, 16px); line-height: 1.45; }
.on-light .card p { color: var(--ink-2); }
.on-dark .card p { color: var(--paper-2); }
.card.hard { border-top: 3px solid var(--blue) !important; }
.card.pref { border: 1.5px dashed var(--teal) !important; }
.card.topline { border: 0 !important; border-top: 3px solid var(--navy) !important; border-radius: 0; background: transparent !important; padding-inline: 0; }
.on-dark .card.topline { border-top-color: var(--teal) !important; }
button.card { font: inherit; color: inherit; text-align: left; cursor: pointer; transition: box-shadow 160ms ease, transform 160ms ease; }
button.card:hover { box-shadow: 0 0 0 2px var(--teal); }
button.card[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--teal), 0 8px 22px rgba(20,38,61,.16); }
.cols { display: grid; gap: 12px; }
.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.big { font-size: clamp(28px, 2.7vw, 50px); font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; font-weight: 600; align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sq-hard { width: 13px; height: 13px; border-radius: 3px; background: var(--blue); display: inline-block; }
.sq-pref { width: 13px; height: 13px; border-radius: 3px; border: 2px dashed var(--teal); display: inline-block; }

table.t { width: 100%; border-collapse: collapse; font-size: clamp(12px, .88vw, 15px); font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: left; padding: 7px 9px; vertical-align: top; }
table.t thead th { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.on-light table.t thead th { color: var(--ink-2); border-bottom: 2px solid var(--border); }
.on-dark table.t thead th { color: var(--paper-2); border-bottom: 2px solid rgba(255,255,255,.14); }
.on-light table.t td { border-bottom: 1px solid var(--border); }
.on-dark table.t td { border-bottom: 1px solid rgba(255,255,255,.1); }
.on-light table.t { background: rgba(255,255,255,.92); border-radius: 12px; }
table.t tr.rec td { background: var(--blue-soft); }
table.t tr.pick { cursor: pointer; }
table.t tr.pick:hover td { box-shadow: inset 0 -2px 0 var(--teal); }
table.t tr.on td { outline: 2px solid var(--teal); outline-offset: -2px; }
table.t td.num { text-align: right; }
table.t th.num { text-align: right; }
.pickhint { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-left: 6px; vertical-align: middle; }

.ex { font-family: var(--mono); font-size: clamp(13px, .95vw, 16px); display: flex; flex-direction: column; gap: 6px; }
.ex div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.07); }
.ex b { font-size: 1.05em; white-space: nowrap; }
.ex .one { color: var(--cyan); }
.formula { font-family: var(--mono); font-weight: 700; font-size: clamp(16px, 1.6vw, 30px); padding: clamp(14px, 1.4vw, 24px); border-radius: 14px; background: var(--navy); color: var(--white); letter-spacing: -.01em; }
.fx span[data-f] { cursor: pointer; padding: 2px 6px; border-radius: 6px; transition: background 160ms ease; }
.fx span[data-f]:hover { background: rgba(255,255,255,.1); }
.fx span[data-f].on { background: rgba(110,231,245,.22); box-shadow: inset 0 0 0 1px var(--cyan); }
#fparts .card.on { box-shadow: 0 0 0 2px var(--teal); }
#dec li { display: block; }
#dec .card { padding: 12px 14px; }
.formula small { display: block; font-family: var(--font); font-weight: 500; font-size: 13px; color: var(--paper-2); margin-top: 8px; letter-spacing: 0; }
code, .code { font-family: var(--mono); font-weight: 500; font-size: .95em; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--mint); color: var(--navy); font-weight: 700; }
.chipw { font-size: 12px; font-weight: 700; color: var(--amber); }
.on-dark .chipw { color: var(--amber-2); }
.chipg { font-size: 12px; font-weight: 700; color: var(--green); }
.cnum { font-family: var(--mono); font-weight: 700; color: var(--blue); }
.on-dark .cnum { color: var(--cyan); }
.steps { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; gap: 10px; align-items: stretch; }
.steps .arrow { align-self: center; color: var(--teal); }
.steps .arrow svg { width: 26px; height: 26px; }
.numlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.numlist li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; font-size: clamp(13px, .98vw, 17px); line-height: 1.4; }
.numlist .n { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--blue); color: #fff; font-weight: 800; font-size: 13px; }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: clamp(13px, .95vw, 16px); line-height: 1.4; }

.bars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(8px, 1.2vw, 18px); align-items: end; height: clamp(160px, 26vh, 280px); }
.bars button { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars .lane { width: 100%; max-width: 64px; flex: 1; background: #E3E8EF; border-radius: 8px; position: relative; overflow: hidden; }
.bars .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #4C6A92; border-radius: 8px; transition: background 200ms ease; }
.bars button[aria-pressed="true"] .fill { background: var(--blue); }
.bars .v { font-weight: 800; font-size: clamp(15px, 1.2vw, 21px); font-variant-numeric: tabular-nums; }
.bars .d { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.bars button:focus-visible .lane { outline: 2px solid var(--blue); outline-offset: 2px; }
.tagb { display: inline-block; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: var(--blue-soft); color: #2A57C4; }

.alloc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.alloc button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--white); border: 1px solid var(--border); color: var(--ink); min-width: 0; }
.alloc button.hl { background: var(--blue-soft); border: 1.5px solid var(--blue); }
.alloc button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--teal); }
.alloc h3 { font-size: 15px; }
.alloc .s { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.room { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.room b { font-weight: 600; color: var(--ink-2); }
.room .seats { display: flex; gap: 3px; flex-wrap: wrap; }
.room .seats i { width: 13px; height: 13px; display: inline-block; }
.room .seats i.e { background: repeating-linear-gradient(45deg, #CBD5E1 0 2px, transparent 2px 4px); border: 1px solid #CBD5E1; border-radius: 2px; }
.room .r { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px; }
.room .r.amb { color: var(--amber); font-weight: 800; }
.mk { display: inline-block; width: 13px; height: 13px; }

.sw { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.7); border: 1px solid var(--border); }
.swtrack { width: 58px; height: 32px; border-radius: 16px; position: relative; background: var(--teal); transition: background 260ms ease; flex: none; }
.swtrack::after { content: ""; position: absolute; top: 4px; left: 30px; width: 24px; height: 24px; border-radius: 50%; background: var(--white); transition: left 260ms var(--ease-out); }
.sw.off .swtrack { background: var(--amber); }
.sw.off .swtrack::after { left: 4px; }
.sw b { display: block; font-family: var(--mono); font-size: 15px; }
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; gap: 10px; }
.slider output { font-family: var(--mono); font-weight: 700; color: var(--teal); }
input[type=range] { width: 100%; accent-color: var(--teal); height: 26px; }
.ends { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; font-weight: 600; opacity: .8; }
.lam { font-family: var(--font); font-size: clamp(80px, 9vw, 170px); font-weight: 800; color: var(--teal); line-height: .9; text-align: center; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.on-light :focus-visible { outline-color: var(--blue); }
.cover-orbits { position: absolute; right: 0; top: 0; bottom: 0; width: 46vw; pointer-events: none; opacity: 0; transition: opacity 900ms ease; }
.cover-orbits.in { opacity: 1; }

/* footer */
.foot { position: absolute; left: calc(var(--g) + clamp(0px, 2vw, 32px)); right: calc(var(--gr) + clamp(0px, 2vw, 32px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); display: flex; justify-content: space-between; gap: 16px; font-size: 11px; font-weight: 500; opacity: .78; }
.foot b { font-weight: 800; font-variant-numeric: tabular-nums; }
.nav { position: absolute; left: var(--g); right: var(--gr); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; align-items: center; gap: 12px; padding-inline: clamp(0px, 2vw, 32px); }
.prog { flex: 1; display: flex; gap: 4px; min-width: 0; }
.prog button { flex: 1; height: 22px; border: 0; padding: 0; background: transparent; color: inherit; cursor: pointer; position: relative; min-width: 5px; }
.prog button::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 2px; border-radius: 2px; background: currentColor; opacity: .32; }
.prog button.done::after { opacity: .65; }
.prog button.on::after { opacity: 1; height: 4px; top: 9px; background: var(--teal); }
.counter { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .06em; min-width: 4.5em; text-align: center; }
.iconbtn { height: 36px; min-width: 36px; padding: 0 9px; border-radius: 10px; border: 1px solid currentColor; background: transparent; color: inherit; display: inline-flex; gap: 6px; align-items: center; justify-content: center; cursor: pointer; opacity: .88; flex: none; font: 600 13px var(--font); }
.iconbtn:hover { opacity: 1; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--navy); opacity: 1; }
#ui.on-light .top, #ui.on-light .nav, #ui.on-light .foot { color: var(--ink); }
#ui.on-dark .top, #ui.on-dark .nav, #ui.on-dark .foot { color: var(--paper); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--navy); color: var(--paper-2); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; transition: opacity 600ms ease; z-index: 5; }
#loading.gone { opacity: 0; pointer-events: none; }

@media (max-width: 860px) {
  .panel.left, .panel.right, .panel.wide, .panel.band, .panel.cover { left: var(--g); right: var(--gr); width: auto; top: auto; translate: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 88px); max-height: 62vh; overflow: auto; justify-content: flex-start; pointer-events: auto; }
  .panel.band { gap: 12px; }
  .panel.band .head { max-width: none; }
  .cols.c3, .cols.c4, .cols.c5, .alloc, .steps { grid-template-columns: minmax(0, 1fr); }
  .steps .arrow { display: none; }
  .cols.c2 { grid-template-columns: minmax(0, 1fr); }
  .foot { display: none; }
  .cover-orbits { display: none; }
  .hide-sm { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { .panel, #scrim, .cover-orbits { transition: none !important; } }
</style>

<canvas id="stage" aria-hidden="true"></canvas>
<div id="scrim"></div>
<div id="band"></div>
<div id="labels" class="on-dark" aria-hidden="true"></div>

<div id="ui" class="on-dark">
  <svg class="cover-orbits" id="orbits" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <ellipse cx="330" cy="400" rx="250" ry="120" fill="none" stroke="#6EE7F5" stroke-opacity=".22" stroke-width="1.5" transform="rotate(-28 330 400)"/>
    <ellipse cx="330" cy="400" rx="190" ry="78" fill="none" stroke="#B8B5FF" stroke-opacity=".2" stroke-width="1.5" transform="rotate(-28 330 400)"/>
    <circle cx="330" cy="400" r="44" fill="#14263D" stroke="#FFFFFF" stroke-opacity=".25"/>
    <circle cx="545" cy="288" r="11" fill="#16A6A1"/>
  </svg>
  <div class="top">
    <span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4.5" fill="currentColor"/><ellipse cx="16" cy="16" rx="13" ry="6.5" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-30 16 16)"/><circle cx="26.4" cy="9.8" r="2.6" fill="#16A6A1"/></svg>ORBIT</span>
  </div>
  <div id="stagehtml"></div>
  <div class="foot" id="foot"><span id="footsrc"></span><b id="footnum"></b></div>
  <div class="nav">
    <button class="iconbtn" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg></button>
    <div class="prog" id="prog" role="tablist" aria-label="Slides"></div>
    <span class="counter" id="counter">01 / 17</span>
    <button class="iconbtn" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></svg></button>
    <button class="iconbtn hide-sm" id="motion" aria-pressed="false" aria-label="Reduce motion" title="Reduce motion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h4l2-5 4 10 2-5h4"/></svg></button>
    <button class="iconbtn hide-sm" id="fs" aria-label="Full screen" title="Full screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  </div>
  <div class="sr" aria-live="polite" id="live"></div>

/* ============================================================ UI */
const ui = document.getElementById('ui');
const stageHtml = document.getElementById('stagehtml');
const scrim = document.getElementById('scrim');

const prog = document.getElementById('prog');
const counter = document.getElementById('counter');
const live = document.getElementById('live');
const orbits = document.getElementById('orbits');
SLIDES.forEach((s, i) => { const b = document.createElement('button'); b.setAttribute('role', 'tab'); b.setAttribute('aria-label', `Slide ${i + 1}`); b.addEventListener('click', () => go(i)); prog.appendChild(b); });
let cur = -1, token = 0, demoToken = 0;

function setScrim(s) {
  const c = s.mint ? '221,245,235' : s.theme === 'dark' ? '20,38,61' : '247,249,252';
  let bg = 'none';
  if (s.layout === 'left' || s.layout === 'cover') bg = `linear-gradient(90deg, rgba(${c},.95) 0%, rgba(${c},.85) 36%, rgba(${c},0) 62%)`;
  if (s.layout === 'wide') bg = `linear-gradient(90deg, rgba(${c},.96) 0%, rgba(${c},.9) 54%, rgba(${c},0) 78%)`;
  if (s.layout === 'right') bg = `linear-gradient(270deg, rgba(${c},.95) 0%, rgba(${c},.85) 36%, rgba(${c},0) 62%)`;
  if (s.layout === 'band') bg = `linear-gradient(180deg, rgba(${c},.95) 0%, rgba(${c},.6) 22%, rgba(${c},0) 36%, rgba(${c},0) 52%, rgba(${c},.75) 70%, rgba(${c},.95) 100%)`;
  if (innerWidth < 860) bg = `linear-gradient(0deg, rgba(${c},.97) 0%, rgba(${c},.92) 58%, rgba(${c},0) 80%)`;
  scrim.style.background = bg; scrim.style.opacity = 1;
  bandEl.style.background = `linear-gradient(0deg, rgba(${c},.92) 0%, rgba(${c},.6) 45%, rgba(${c},0) 100%)`;
}
const pressGroup = (el, sel, btn) => el.querySelectorAll(sel).forEach((x) => x.setAttribute('aria-pressed', String(x === btn)));

  if (s.id === 'problem') el.querySelectorAll('[data-demo]').forEach((b) => b.addEventListener('click', async () => {
    pressGroup(el, '[data-demo]', b); const t = ++demoToken; const k = b.dataset.demo;
    if (k === 'rigid') { VIEW.tag = 'occ'; setDay(3); await setArrangement('l0'); return; }
    if (k === 'paper') { VIEW.tag = 'desks'; setDay(0); await setArrangement('l05'); return; }
    VIEW.tag = 'occ'; let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let d = 0; d < 5 && t === demoToken; d++) {
      setDay(d); const seats = [...DESKS].sort(() => rnd() - 0.5).map((x) => x.id); ARR.shuffle = {}; people.forEach((p, i) => (ARR.shuffle[p.num] = seats[i]));
      await setArrangement('shuffle', true, 12); await wait(500);
    }
  }));
  if (s.id === 'requirements') el.querySelectorAll('[data-req]').forEach((b) => b.addEventListener('click', async () => {
    pressGroup(el, '[data-req]', b); const t = ++demoToken; const k = +b.dataset.req;
    TAGSHOW.sep = k === 2 ? 1 : 0; VIEW.tag = k === 5 ? 'cap' : 'occ'; VIEW.mc = 0.8;
    if (k === 1) buildTeamLinks(); if (k === 2) buildSep();
    tween(ST, { links: k === 1 ? 1 : 0, sep: k === 2 ? 1 : 0, halo: k === 5 ? 1 : 0, labels: k >= 3 ? 1 : 0 }, 500);
    if (k === 3 || k === 4) for (let d = 0; d < 5 && t === demoToken; d++) { setDay(d); await wait(1300); }
  }));
  if (s.id === 'goals') {
    const r = el.querySelector('#lam'), out = el.querySelector('#lamout'), note = el.querySelector('#lamnote');
    const upd = (anim) => { const l = +r.value; out.textContent = l.toFixed(1); const k = l >= 0.95 ? 'l1' : l <= 0.05 ? 'l0' : 'l05'; note.textContent = `The office shows the paper’s plan for the dial at ${k === 'l1' ? '1' : k === 'l0' ? '0' : '0.5'}: ${withTeam(ARR[k])} of 25 sit with their team.`; if (k !== VIEW.arr) setArrangement(k, anim).then(() => cur >= 0 && SLIDES[cur].id === 'goals' && buildTeamLinks()); };
    r.addEventListener('input', () => upd(true)); upd(false); buildTeamLinks();
  }
  if (s.id === 'decides') el.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => {

  }));

    const pick = (f) => {

      VIEW.mc = +r.value; out.textContent = `${Math.round(VIEW.mc * 100)}%`;

      sw.classList.toggle('off', !on); swt.textContent = on ? 'Switch ON · the limit is used' : 'Switch OFF · whole rooms are used';

async function go(i, force = false) {
  i = clamp(i, 0, SLIDES.length - 1);
  if (i === cur && !force) return;
  const prev = cur; cur = i; const tok = ++token; demoToken++;
  const s = SLIDES[i];
  try { history.replaceState(null, '', '#' + s.id); } catch (e) {}
  [...prog.children].forEach((b, k) => { b.classList.toggle('on', k === i); b.classList.toggle('done', k < i); b.setAttribute('aria-selected', String(k === i)); });
  counter.textContent = `${String(i + 1).padStart(2, '0')} / ${SLIDES.length}`;
  document.getElementById('footsrc').textContent = s.foot;
  document.getElementById('footnum').textContent = i ? String(i + 1).padStart(2, '0') : '';
  live.textContent = `Slide ${i + 1} of ${SLIDES.length}`;
  orbits.classList.toggle('in', s.id === 'cover' && innerWidth >= 860);
  if (panelEl) { const old = panelEl; old.classList.remove('in'); setTimeout(() => old.remove(), reduced ? 0 : 420); panelEl = null; }
  scrim.style.opacity = 0;
  VIEW.tag = s.view.tag; VIEW.mc = 0.8;
  setDay(s.view.day, prev !== -1);
  if (VIEW.arr !== s.view.arr || walkers.size) setArrangement(s.view.arr, false);
  Object.keys(TAGSHOW).forEach((k) => (TAGSHOW[k] = (s.tags && s.tags[k]) || 0));
  if (s.st.sep) buildSep();
  if (s.st.links) buildTeamLinks();
  idle = { on: !!s.idle, t0: performance.now() };
  const D = reduced ? 0 : (prev === -1 ? 1600 : s.dur);
  tween(ST, s.st, D * 0.85);
  camTo(s.cam, D, ease.io, s.arc || 0);
  setTimeout(() => { if (tok !== token) return; const th = s.theme === 'light' ? 'on-light' : 'on-dark'; ui.className = th; labelLayer.className = th; }, D * 0.4);
  setTimeout(() => {
    if (tok !== token) return;
    setScrim(s);
    panelEl = document.createElement('section');
    panelEl.className = `panel ${s.layout}`; panelEl.setAttribute('aria-label', `Slide ${i + 1}`);
    panelEl.innerHTML = s.html; stageHtml.appendChild(panelEl); wire(s, panelEl);
    requestAnimationFrame(() => requestAnimationFrame(() => panelEl && panelEl.classList.add('in')));
  }, D * 0.55);
}

addEventListener('keydown', (e) => {
  const t = e.target;
  if (t.closest && t.closest('input, textarea')) return;
  if (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && !t.closest('button'))) { e.preventDefault(); go(cur + 1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }

  if (e.key === 'End') go(SLIDES.length - 1);
  if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
});
let tx = null;
addEventListener('touchstart', (e) => { if (e.target.closest('.panel')) return; tx = e.touches[0].clientX; }, { passive: true });
